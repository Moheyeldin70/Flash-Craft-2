name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure pre-installed Android SDK & licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Maven Central mirror
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/maven-mirror.gradle"
          gradle.settingsEvaluated { settings ->
              [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { handler ->
                  def mirror = handler.maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                  }
                  handler.remove(mirror)
                  def centralIdx = handler.findIndexOf { it.name == "MavenRepo" }
                  handler.add(centralIdx >= 0 ? centralIdx : 0, mirror)
              }
          }
          EOF

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64_VAR: ${{ vars.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            elif [ -f app/debug.keystore.base64 ]; then
              tr -d '\r\n ' < app/debug.keystore.base64 | base64 -d > debug.keystore
              echo "Restored debug.keystore from app/debug.keystore.base64."
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
              echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
            elif [ -n "$DEBUG_KEYSTORE_BASE64_VAR" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64_VAR" | tr -d '\r\n ' | base64 -d > debug.keystore
              echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 variable."
            else
              echo "::warning::Neither debug.keystore.base64 nor DEBUG_KEYSTORE_BASE64 was found; generating a temporary debug keystore (its SHA-1 will not match Firebase)."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Check Firebase config & signing SHA-1
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::error::app/google-services.json is missing in this GitHub repository. Add a GOOGLE_SERVICES_JSON secret (paste the contents of app/google-services.json) in GitHub Settings -> Secrets and variables -> Actions, or commit app/google-services.json."
            exit 1
          fi

          ACTUAL_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA1:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)
          echo "Active debug.keystore SHA-1: $ACTUAL_SHA1"
          python3 - "$ACTUAL_SHA1" << 'PY'
          import json, sys
          actual = sys.argv[1].strip().lower()
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          expected = []
          for c in data.get("client", []):
              pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if pkg == "com.aistudio.flashcraft.vqmxtp":
                  for oc in c.get("oauth_client", []):
                      h = oc.get("android_info", {}).get("certificate_hash")
                      if h:
                          expected.append(h.lower())
          if expected and actual not in expected:
              print(f"::error::debug.keystore SHA-1 ({actual}) does not match app/google-services.json ({expected}). Google Sign-In will fail after selecting an account! Commit debug.keystore.base64 or add a DEBUG_KEYSTORE_BASE64 secret in GitHub Settings -> Secrets and variables -> Actions.")
              sys.exit(1)
          print(f"Verified debug.keystore SHA-1 matches app/google-services.json ({expected or 'none listed'}).")
          PY

      - name: Run unit tests
        run: gradle testDebugUnitTest --max-workers=2 --console=plain

      - name: Build Debug APK
        run: gradle assembleDebug --max-workers=2 --console=plain

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK (if signing secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            gradle assembleRelease --max-workers=2 --console=plain
            echo "RELEASE_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets not set; skipping release APK."
            echo "RELEASE_BUILT=false" >> "$GITHUB_ENV"
          fi

      - name: Upload Release APK artifact
        if: env.RELEASE_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flashcraft-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
